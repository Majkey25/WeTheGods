# Events: shows, releases, parties, signings... Newest first. Edit them in the admin (Pages CMS).
# Upcoming events appear on the site automatically; finished ones move to "Past" overnight.
# Every event gets its own page with details, directions and an "Add to calendar" file.
# The build checks every field, so a mistake never reaches the live site.
#
#   type: show | release | party | signing | other      (default show)
#   title        event name (festival, tour, release...)  date: 2026-11-14 (required)
#   time / doors / end: 20:00                             venue, address, city, country: CZ
#   map: https://...  own map link                        lineup: [Band A, Band B]
#   tickets: https://...                                  status: sold-out | cancelled | postponed | free
#   info_cs / info_en    longer description               poster: ../assets/posters/file.jpg

