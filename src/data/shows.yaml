# WeTheGods shows.
#
# Add a show: copy one block, give it a new unique name (e.g. 2026-11-14-brno), edit the fields,
# commit. The site rebuilds automatically. Upcoming shows are listed first; once the date passes,
# the show moves to "Past shows" on its own (the site rebuilds every night).
# A typo cannot break the live site: the build checks every field and stops if something is wrong.
#
#   date:     2026-11-14            required, YYYY-MM-DD
#   time:     20:00                 optional, 24-hour clock
#   venue:    Klub Mír              required
#   city:     Uherské Hradiště      required
#   country:  CZ                    optional, 2-letter code, default CZ
#   event:    Festival or tour name optional
#   lineup:   [Band A, Band B]      optional, other bands on the bill
#   tickets:  https://...           optional, ticket link (https only)
#   status:   sold-out | cancelled | postponed | free   optional

