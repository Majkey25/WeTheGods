- slug: yeba
  title: Y.E.B.A.
  description_en: A smile on the outside, a struggle underneath. ONE opens with a portrait of a mind pushed to its limits.
  description_cs: Navenek úsměv, uvnitř boj. Úvodní skladba ONE zachycuje mysl, která se dostává na hranici svých sil.
  meaning_en: The contrast between an outward smile and private suffering runs through the song. Its narrator feels trapped by relentless thoughts and a disappearing sense of possibility. Read as an account of a crisis, it gives voice to pain that can stay hidden from everyone nearby.
  meaning_cs: Skladbou prochází rozpor mezi úsměvem pro okolí a utrpením v soukromí. Vypravěče svazují neustálé myšlenky a ztráta výhledu do budoucnosti. Text lze číst jako zachycení krize, která dává hlas bolesti, již lidé kolem nemusí vůbec vidět.
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Y-E-B-A

- slug: alone-i-stand
  title: Alone I Stand
  description_en: Alone in an open space, still searching for someone to hear. A song about isolation and the need for connection.
  description_cs: Sám uprostřed prázdna, přesto s potřebou být vyslyšen. Skladba o izolaci a touze najít cestu k druhým.
  meaning_en: Images of cold, sleeplessness and an inner hiding place make loneliness feel physical. The repeated search for someone who can help suggests that isolation is also a barrier to being understood. The song leaves an uneasy question about whether solitude offers shelter or keeps us trapped.
  meaning_cs: Obrazy chladu, nespavosti a úkrytu ve vlastní hlavě dávají samotě téměř hmatatelnou podobu. Opakované hledání pomoci naznačuje, že izolace brání také porozumění. Skladba nechává otevřenou otázku, zda je samota útočištěm, nebo místem, ze kterého nedokážeme odejít.
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Alone-I-Stand

- slug: labyrinth-of-lies
  title: Labyrinth of Lies
  description_en: Information overload, manufactured truths and a world that wants another customer. Finding a way out starts with questioning the script.
  description_cs: Informační přetlak, hotové pravdy a svět, který chce dalšího zákazníka. Cesta ven začíná otázkou, komu vlastně věříme.
  meaning_en: The labyrinth becomes a picture of competing messages, consumer promises and choices shaped by those in power. Personal identity is caught in the middle. The refusal to accept a ready-made version of reality can be read as the song's call to think independently.
  meaning_cs: Labyrint tu představuje soupeřící sdělení, konzumní sliby a možnosti určované těmi, kdo mají moc. Uprostřed toho všeho stojí vlastní identita. Odmítnutí přijmout předem připravenou verzi reality lze chápat jako výzvu k samostatnému myšlení.
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Labyrinth-of-Lies

- slug: illusions
  title: Illusions
  description_en: The hardest mask to remove is the one we wear for ourselves. Illusions follows the tension between self-doubt and another attempt to move forward.
  description_cs: Nejtěžší je sundat masku, kterou nosíme sami před sebou. Illusions sleduje napětí mezi pochybnostmi a dalším pokusem jít dál.
  meaning_en: An unreliable inner voice and a sense of never being enough turn the conflict inward. The illusions can be read as beliefs that distort how the narrator sees themself. Alongside exhaustion, the lyrics leave room for the small but deliberate act of trying again.
  meaning_cs: Nespolehlivý vnitřní hlas a pocit, že žádná snaha nestačí, obracejí konflikt dovnitř. Iluze lze číst jako přesvědčení, která zkreslují pohled na sebe sama. Vedle vyčerpání zůstává v textu prostor pro drobné, ale vědomé rozhodnutí zkusit to znovu.
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Illusions

- slug: disconnect-exe
  title: Disconnect.exe
  description_en: The closing title on ONE turns disconnection into a command. A final invitation to pause and step away from the noise.
  description_cs: Závěrečný název na ONE mění odpojení v příkaz. Poslední zastavení a prostor vystoupit z okolního hluku.
  meaning_en: The executable-file title suggests a deliberate break, as if disconnecting could be a process we choose to run. This reading draws on the title and its place at the end of ONE; lyrics are not currently published on Musixmatch.
  meaning_cs: Název ve tvaru spustitelného souboru evokuje vědomé přerušení, jako by odpojení bylo procesem, který lze sám spustit. Tento výklad vychází z názvu a závěrečné pozice na EP ONE; text zatím na Musixmatch není zveřejněný.
  meaning_basis: title
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Disconnect-exe
  lyrics_available: false

- slug: reflection
  title: Reflection (feat. Damián Kučera)
  description_en: A look in the mirror that reaches beyond the individual. Reflection asks what our choices will leave for those who come after us.
  description_cs: Pohled do zrcadla, který nekončí u jednotlivce. Reflection se ptá, co naše rozhodnutí zanechají těm, kdo přijdou po nás.
  meaning_en: The song connects a lack of self-reflection with the harm our decisions can cause. Its questions about children and the future extend that responsibility across generations. Change appears as something that requires honest scrutiny of our own behaviour, rather than another promise.
  meaning_cs: Skladba propojuje chybějící sebereflexi s důsledky, kterými mohou naše rozhodnutí zasahovat ostatní. Otázky mířené k dětem a budoucnosti rozšiřují odpovědnost napříč generacemi. Změna tu působí jako něco, co potřebuje poctivý pohled na vlastní chování, nikoli další slib.
  lyrics_url: https://www.musixmatch.com/lyrics/WETHEGODS/Reflection-Damian-Kucera
